[package]
name = "illum"
description = "Illumination: direct, IP-only remote desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "illum"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
illum-core.workspace = true
illum-ffmpeg.workspace = true
illum-net.workspace = true
illum-media.workspace = true
illum-ui.workspace = true
illum-win.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
arboard = { version = "3.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
