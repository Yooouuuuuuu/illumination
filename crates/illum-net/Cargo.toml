[package]
name = "illum-net"
description = "Direct TCP + TLS 1.3 transport, pairing and channel framing for Illumination"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1.12.1"
if-addrs = "0.15.0"
illum-core.workspace = true
rcgen = "0.14.7"
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tracing = "0.1.44"
