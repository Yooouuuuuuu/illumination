[workspace]
resolver = "3"
members = ["crates/illum", "crates/illum-core", "crates/illum-net"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/<owner>/illumination"
rust-version = "1.85"

[workspace.dependencies]
illum-core = { path = "crates/illum-core" }
illum-net = { path = "crates/illum-net" }
